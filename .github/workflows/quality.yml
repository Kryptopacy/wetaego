name: Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install dependencies
      working-directory: ./apps/web
      run: pnpm install
      
    - name: Run Linter
      working-directory: ./apps/web
      run: pnpm lint
      
    - name: Type Check
      working-directory: ./apps/web
      run: pnpm tsc --noEmit
      
    - name: Run Unit Tests
      working-directory: ./apps/web
      run: pnpm test
